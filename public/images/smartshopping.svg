<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="shopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121815"/>
      <stop offset="50%" stop-color="#15241e"/>
      <stop offset="100%" stop-color="#0a120e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#shopBg)" stroke="#1a382c" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect width="600" height="42" rx="16" fill="#14261f"/>
  <rect y="26" width="600" height="16" fill="#14261f"/>
  <circle cx="25" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="59" cy="21" r="5.5" fill="#10b981"/>
  <text x="50%" y="26" text-anchor="middle" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Smart Shopping Assistant • AI OCR &amp; Recommendation Engine</text>

  <!-- Metric Badges -->
  <g transform="translate(30, 60)">
    <rect width="165" height="46" rx="8" fill="#183329" stroke="#1f4d3c"/>
    <text x="14" y="20" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">EXTRACTION PIPELINE</text>
    <text x="14" y="38" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">Receipt OCR + NLP</text>
  </g>
  <g transform="translate(210, 60)">
    <rect width="180" height="46" rx="8" fill="#183329" stroke="#1f4d3c"/>
    <text x="14" y="20" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">INTELLIGENT INSIGHTS</text>
    <text x="14" y="38" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">Hybrid Recommendations</text>
  </g>
  <g transform="translate(405, 60)">
    <rect width="165" height="46" rx="8" fill="#183329" stroke="#1f4d3c"/>
    <text x="14" y="20" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">SAVINGS &amp; ANALYTICS</text>
    <text x="14" y="38" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">Optimized Shopping Lists</text>
  </g>

  <!-- Main Content Layout -->
  <g transform="translate(30, 120)">
    <!-- Scanned Bill Left Side -->
    <rect width="210" height="230" rx="8" fill="#0b1612" stroke="#1a382c"/>
    <text x="18" y="28" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="600">RECEIPT SCANNER (OCR)</text>
    
    <g transform="translate(18, 45)">
      <rect width="174" height="28" rx="4" fill="#132a21"/>
      <text x="10" y="18" fill="#e2e8f0" font-family="monospace" font-size="10">Item: Organic Milk x 2</text>
      <text x="135" y="18" fill="#34d399" font-family="monospace" font-size="10">$6.40</text>
    </g>
    <g transform="translate(18, 80)">
      <rect width="174" height="28" rx="4" fill="#132a21"/>
      <text x="10" y="18" fill="#e2e8f0" font-family="monospace" font-size="10">Item: Almond Butter</text>
      <text x="135" y="18" fill="#34d399" font-family="monospace" font-size="10">$8.99</text>
    </g>
    <g transform="translate(18, 115)">
      <rect width="174" height="28" rx="4" fill="#132a21"/>
      <text x="10" y="18" fill="#e2e8f0" font-family="monospace" font-size="10">Item: Whole Grain Bread</text>
      <text x="135" y="18" fill="#34d399" font-family="monospace" font-size="10">$4.20</text>
    </g>

    <!-- Scan Line Effect -->
    <line x1="18" y1="160" x2="192" y2="160" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="18" y="185" fill="#34d399" font-family="monospace" font-size="10">✓ 3 items parsed accurately</text>
    <text x="18" y="205" fill="#64748b" font-family="monospace" font-size="9.5">Extracted via FastAPI OCR API</text>

    <!-- Right Analytics & Recommendation Cards -->
    <g transform="translate(230, 0)">
      <rect width="310" height="105" rx="8" fill="#0b1612" stroke="#1a382c"/>
      <text x="16" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">SMART ALTERNATIVES RECOMMENDED</text>
      
      <!-- Offer 1 -->
      <rect x="16" y="38" width="278" height="28" rx="4" fill="#10251d"/>
      <text x="26" y="56" fill="#f8fafc" font-family="sans-serif" font-size="10.5">Almond Butter → Store Brand</text>
      <text x="210" y="56" fill="#4ade80" font-family="sans-serif" font-size="10.5" font-weight="700">Save 28% ($2.50)</text>

      <!-- Offer 2 -->
      <rect x="16" y="72" width="278" height="25" rx="4" fill="#10251d"/>
      <text x="26" y="88" fill="#94a3b8" font-family="sans-serif" font-size="10">Scraped from 4 live competitor stores</text>

      <!-- Monthly Analytics Chart -->
      <g transform="translate(0, 115)">
        <rect width="310" height="115" rx="8" fill="#0b1612" stroke="#1a382c"/>
        <text x="16" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="600">MONTHLY SPENDING PATTERNS &amp; ANALYTICS</text>
        
        <!-- Bar Graph -->
        <rect x="30" y="65" width="26" height="35" rx="3" fill="#1e3a8a"/>
        <rect x="75" y="50" width="26" height="50" rx="3" fill="#1e3a8a"/>
        <rect x="120" y="70" width="26" height="30" rx="3" fill="#1e3a8a"/>
        <rect x="165" y="40" width="26" height="60" rx="3" fill="#059669"/>
        <rect x="210" y="30" width="26" height="70" rx="3" fill="#10b981"/>
        <rect x="255" y="45" width="26" height="55" rx="3" fill="#34d399"/>
        
        <text x="32" y="110" fill="#64748b" font-family="sans-serif" font-size="8.5">W1</text>
        <text x="77" y="110" fill="#64748b" font-family="sans-serif" font-size="8.5">W2</text>
        <text x="122" y="110" fill="#64748b" font-family="sans-serif" font-size="8.5">W3</text>
        <text x="167" y="110" fill="#64748b" font-family="sans-serif" font-size="8.5">W4</text>
        <text x="212" y="110" fill="#64748b" font-family="sans-serif" font-size="8.5">W5</text>
        <text x="257" y="110" fill="#64748b" font-family="sans-serif" font-size="8.5">Cur</text>
      </g>
    </g>
  </g>
</svg>
