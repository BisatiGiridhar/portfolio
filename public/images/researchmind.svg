<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130e24"/>
      <stop offset="50%" stop-color="#181135"/>
      <stop offset="100%" stop-color="#0d0818"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad1)" stroke="#3b2d54" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect width="600" height="42" rx="16" fill="#1b1430"/>
  <rect y="26" width="600" height="16" fill="#1b1430"/>
  <circle cx="25" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="59" cy="21" r="5.5" fill="#10b981"/>
  <text x="50%" y="26" text-anchor="middle" fill="#9d8bb8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">ResearchMind AI • Multi-Agent LangGraph System</text>

  <!-- Metric Badges -->
  <g transform="translate(30, 60)">
    <rect width="160" height="48" rx="8" fill="#20173d" stroke="#3d2c68"/>
    <text x="14" y="22" fill="#a78bfa" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">LANGGRAPH AGENTS</text>
    <text x="14" y="40" fill="#fff" font-family="sans-serif" font-size="15" font-weight="700">10 Active Agents</text>
  </g>
  <g transform="translate(205, 60)">
    <rect width="180" height="48" rx="8" fill="#20173d" stroke="#3d2c68"/>
    <text x="14" y="22" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">SOURCES &amp; CITATIONS</text>
    <text x="14" y="40" fill="#fff" font-family="sans-serif" font-size="15" font-weight="700">arXiv • Crossref • Tavily</text>
  </g>
  <g transform="translate(400, 60)">
    <rect width="170" height="48" rx="8" fill="#20173d" stroke="#3d2c68"/>
    <text x="14" y="22" fill="#4ade80" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">SYNTHESIS QUALITY</text>
    <text x="14" y="40" fill="#fff" font-family="sans-serif" font-size="15" font-weight="700">100% Grounded AI</text>
  </g>

  <!-- Agent Flow Graph Area -->
  <rect x="30" y="125" width="540" height="225" rx="10" fill="#0f0a1c" stroke="#2a1f42"/>

  <!-- Graph Connections -->
  <path d="M 120 180 C 180 180, 180 160, 240 160" stroke="#7e22ce" stroke-width="2.5" fill="none" stroke-dasharray="4,4"/>
  <path d="M 120 180 C 180 180, 180 230, 240 230" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-dasharray="4,4"/>
  <path d="M 340 160 C 390 160, 400 195, 450 195" stroke="#a855f7" stroke-width="2.5" fill="none"/>
  <path d="M 340 230 C 390 230, 400 195, 450 195" stroke="#38bdf8" stroke-width="2.5" fill="none"/>

  <!-- Agent Nodes -->
  <!-- Query Decomposer -->
  <g transform="translate(45, 155)">
    <rect width="95" height="50" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.5" filter="url(#glow1)"/>
    <rect width="95" height="50" rx="8" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
    <text x="47" y="25" text-anchor="middle" fill="#f3e8ff" font-family="sans-serif" font-size="10.5" font-weight="600">Query Planner</text>
    <text x="47" y="40" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="9">Decompose</text>
  </g>

  <!-- Live Web Search Agent -->
  <g transform="translate(240, 135)">
    <rect width="105" height="50" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="52" y="25" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="10.5" font-weight="600">Academic Search</text>
    <text x="52" y="40" text-anchor="middle" fill="#818cf8" font-family="sans-serif" font-size="9">arXiv &amp; Scholar</text>
  </g>

  <!-- Fact Check Agent -->
  <g transform="translate(240, 205)">
    <rect width="105" height="50" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1.5"/>
    <text x="52" y="25" text-anchor="middle" fill="#e0f2fe" font-family="sans-serif" font-size="10.5" font-weight="600">Evidence Extractor</text>
    <text x="52" y="40" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="9">Claim Validation</text>
  </g>

  <!-- Report Generator -->
  <g transform="translate(445, 170)">
    <rect width="110" height="50" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5" filter="url(#glow1)"/>
    <rect width="110" height="50" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="55" y="25" text-anchor="middle" fill="#dcfce7" font-family="sans-serif" font-size="10.5" font-weight="600">Synthesis Engine</text>
    <text x="55" y="40" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="9">3D Report Generated</text>
  </g>

  <!-- Bottom Console Status -->
  <rect x="45" y="280" width="510" height="55" rx="6" fill="#090514" stroke="#221833"/>
  <circle cx="62" cy="307" r="4" fill="#10b981"/>
  <text x="75" y="303" fill="#a3e635" font-family="monospace" font-size="11">&gt; 10 LangGraph agents finished orchestration • Citation verified (Crossref API)</text>
  <text x="75" y="322" fill="#9ca3af" font-family="monospace" font-size="10">backend: FastAPI (Vercel) • frontend: Next.js + Three.js 3D Visualizer</text>
</svg>
