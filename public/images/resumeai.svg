<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181120"/>
      <stop offset="50%" stop-color="#24132e"/>
      <stop offset="100%" stop-color="#100b16"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#aiBg)" stroke="#3f234f" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect width="600" height="42" rx="16" fill="#291636"/>
  <rect y="26" width="600" height="16" fill="#291636"/>
  <circle cx="25" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="59" cy="21" r="5.5" fill="#10b981"/>
  <text x="50%" y="26" text-anchor="middle" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">AI Automation Suite • Resume Analysis &amp; Price Engine</text>

  <!-- Metric Badges -->
  <g transform="translate(30, 60)">
    <rect width="165" height="46" rx="8" fill="#311942" stroke="#582a75"/>
    <text x="14" y="20" fill="#e879f9" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">ATS SCORING &amp; NLP</text>
    <text x="14" y="38" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">Semantic Matching</text>
  </g>
  <g transform="translate(210, 60)">
    <rect width="180" height="46" rx="8" fill="#311942" stroke="#582a75"/>
    <text x="14" y="20" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">AUTOMATION WORKFLOWS</text>
    <text x="14" y="38" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">Python • FastAPI • OCR</text>
  </g>
  <g transform="translate(405, 60)">
    <rect width="165" height="46" rx="8" fill="#311942" stroke="#582a75"/>
    <text x="14" y="20" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">DATA PIPELINES</text>
    <text x="14" y="38" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">SQL &amp; MongoDB</text>
  </g>

  <!-- Main Card Body -->
  <g transform="translate(30, 120)">
    <rect width="540" height="230" rx="8" fill="#130b1a" stroke="#2d173b"/>

    <!-- Left side analysis card -->
    <g transform="translate(20, 20)">
      <rect width="240" height="190" rx="8" fill="#1f112a" stroke="#442159"/>
      <text x="15" y="25" fill="#f0abfc" font-family="sans-serif" font-size="11" font-weight="600">RESUME MATCH &amp; KEYWORDS</text>
      
      <!-- Progress Bar 1 -->
      <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">Role: Software Engineer</text>
      <rect x="15" y="60" width="210" height="8" rx="4" fill="#3b1d4f"/>
      <rect x="15" y="60" width="195" height="8" rx="4" fill="#a855f7"/>
      <text x="185" y="52" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="700">93%</text>

      <!-- Progress Bar 2 -->
      <text x="15" y="92" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">Role: AI/ML Developer</text>
      <rect x="15" y="100" width="210" height="8" rx="4" fill="#3b1d4f"/>
      <rect x="15" y="100" width="180" height="8" rx="4" fill="#38bdf8"/>
      <text x="185" y="92" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">88%</text>

      <!-- Tags -->
      <text x="15" y="132" fill="#94a3b8" font-family="sans-serif" font-size="10">Detected Skills:</text>
      <rect x="15" y="142" width="60" height="22" rx="4" fill="#371b4a"/>
      <text x="24" y="157" fill="#d8b4fe" font-family="sans-serif" font-size="9.5">Python</text>
      <rect x="80" y="142" width="70" height="22" rx="4" fill="#371b4a"/>
      <text x="89" y="157" fill="#d8b4fe" font-family="sans-serif" font-size="9.5">LangGraph</text>
      <rect x="155" y="142" width="70" height="22" rx="4" fill="#371b4a"/>
      <text x="165" y="157" fill="#d8b4fe" font-family="sans-serif" font-size="9.5">MongoDB</text>
      
      <text x="15" y="180" fill="#34d399" font-family="sans-serif" font-size="9.5">✓ ATS Optimized &amp; Scored</text>
    </g>

    <!-- Right Side Automation Architecture -->
    <g transform="translate(280, 20)">
      <rect width="240" height="190" rx="8" fill="#1f112a" stroke="#442159"/>
      <text x="15" y="25" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">INVENTORY &amp; COMPARISON PIPELINE</text>
      
      <rect x="15" y="42" width="210" height="34" rx="6" fill="#291438"/>
      <text x="25" y="58" fill="#e2e8f0" font-family="monospace" font-size="10">Web Scraper Worker Pool</text>
      <text x="25" y="70" fill="#94a3b8" font-family="monospace" font-size="9">Active Crawlers: 12 nodes</text>

      <rect x="15" y="86" width="210" height="34" rx="6" fill="#291438"/>
      <text x="25" y="102" fill="#e2e8f0" font-family="monospace" font-size="10">Price Comparison Engine</text>
      <text x="25" y="114" fill="#34d399" font-family="monospace" font-size="9">Dynamic indexing in MongoDB</text>

      <rect x="15" y="130" width="210" height="34" rx="6" fill="#291438"/>
      <text x="25" y="146" fill="#e2e8f0" font-family="monospace" font-size="10">Inventory Tracking API</text>
      <text x="25" y="158" fill="#c084fc" font-family="monospace" font-size="9">SQL Transaction Logging</text>

      <circle cx="25" cy="180" r="3.5" fill="#22c55e"/>
      <text x="35" y="184" fill="#a7f3d0" font-family="sans-serif" font-size="9.5">Real-time alerts &amp; event triggers</text>
    </g>
  </g>
</svg>
