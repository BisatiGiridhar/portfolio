<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="fluxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#12182b"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="fluxBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#fluxBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect width="600" height="42" rx="16" fill="#151d2f"/>
  <rect y="26" width="600" height="16" fill="#151d2f"/>
  <circle cx="25" cy="21" r="5.5" fill="#ef4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
  <circle cx="59" cy="21" r="5.5" fill="#10b981"/>
  <text x="50%" y="26" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">FLUX IDE • Collaborative Cloud Editor (OT Engine)</text>

  <!-- Metric Badges -->
  <g transform="translate(30, 60)">
    <rect width="165" height="46" rx="8" fill="#162238" stroke="#1e3a5f"/>
    <text x="14" y="20" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">CONCURRENCY &amp; OT</text>
    <text x="14" y="38" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">10+ Sessions Conflict-Free</text>
  </g>
  <g transform="translate(210, 60)">
    <rect width="180" height="46" rx="8" fill="#162238" stroke="#1e3a5f"/>
    <text x="14" y="20" fill="#2dd4bf" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">ORCHESTRATION</text>
    <text x="14" y="38" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">Kubernetes • 99.9% Uptime</text>
  </g>
  <g transform="translate(405, 60)">
    <rect width="165" height="46" rx="8" fill="#162238" stroke="#1e3a5f"/>
    <text x="14" y="20" fill="#a78bfa" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">QUALITY ASSURANCE</text>
    <text x="14" y="38" fill="#fff" font-family="sans-serif" font-size="14" font-weight="700">85%+ Jest Coverage</text>
  </g>

  <!-- Editor Window Container -->
  <rect x="30" y="120" width="540" height="230" rx="8" fill="#090d16" stroke="#1e293b"/>

  <!-- Sidebar files -->
  <rect x="30" y="120" width="135" height="230" rx="8" fill="#0c111c"/>
  <text x="45" y="145" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">EXPLORER</text>
  <text x="55" y="172" fill="#38bdf8" font-family="monospace" font-size="11">▾ src</text>
  <text x="70" y="194" fill="#e2e8f0" font-family="monospace" font-size="11">• editor.tsx</text>
  <text x="70" y="216" fill="#94a3b8" font-family="monospace" font-size="11">• ot-engine.ts</text>
  <text x="70" y="238" fill="#94a3b8" font-family="monospace" font-size="11">• socket.ts</text>
  <text x="70" y="260" fill="#94a3b8" font-family="monospace" font-size="11">• cluster.k8s</text>

  <!-- Code area -->
  <g transform="translate(180, 140)">
    <!-- Active Cursors -->
    <text x="0" y="18" fill="#f43f5e" font-family="monospace" font-size="11">interface <tspan fill="#e2e8f0">OperationalTransform</tspan> &#123;</text>
    <text x="16" y="38" fill="#94a3b8" font-family="monospace" font-size="11">version: <tspan fill="#38bdf8">number</tspan>;</text>
    <text x="16" y="58" fill="#94a3b8" font-family="monospace" font-size="11">ops: <tspan fill="#38bdf8">Operation[]</tspan>;</text>
    <text x="0" y="78" fill="#f43f5e" font-family="monospace" font-size="11">&#125;</text>
    <text x="0" y="105" fill="#a855f7" font-family="monospace" font-size="11">export const <tspan fill="#60a5fa">applyRemoteTransform</tspan> = (local, remote) =&gt; &#123;</text>
    <text x="16" y="125" fill="#22c55e" font-family="monospace" font-size="11">// Conflict-free distributed resolution via Redis</text>
    <text x="16" y="145" fill="#e2e8f0" font-family="monospace" font-size="11">return otEngine.<tspan fill="#fbbf24">transform</tspan>(local, remote);</text>
    <text x="0" y="165" fill="#a855f7" font-family="monospace" font-size="11">&#125;;</text>

    <!-- Collaborator Pill indicator -->
    <rect x="230" y="90" width="130" height="24" rx="12" fill="#3b82f6" opacity="0.9"/>
    <circle cx="242" cy="102" r="5" fill="#fff"/>
    <text x="254" y="106" fill="#fff" font-family="sans-serif" font-size="10" font-weight="600">Dev #2 typing...</text>
  </g>

  <!-- Terminal Bottom Strip -->
  <rect x="165" y="315" width="405" height="35" fill="#06090e" stroke="#1e293b"/>
  <circle cx="185" cy="332" r="3.5" fill="#22c55e"/>
  <text x="198" y="336" fill="#94a3b8" font-family="monospace" font-size="10">[k8s cluster] 3 pods healthy • Redis pub/sub sync latency: 12ms</text>
</svg>
